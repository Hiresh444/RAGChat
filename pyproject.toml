[project]
name = "local-pdf-chatbot"
version = "0.1.0"
description = "Local PDF chatbot with Streamlit, ChromaDB, sentence-transformers, and Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb>=0.5.5",
  "ollama>=0.4.4",
  "pymupdf>=1.24.9",
  "sentence-transformers>=3.0.1",
  "streamlit>=1.37.0",
  "langchain-text-splitters>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
